version: 2

# The reference verifiers deliberately have no third-party dependencies - that is the portability
# proof. Dependabot is here for the Rust verifier's crates, and for the GitHub Actions themselves.
# There is deliberately NO npm ecosystem entry: reference/ts has zero dependencies, so there is
# nothing to watch.
updates:
  - package-ecosystem: cargo
    directory: /reference/rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    # In a 0.x crate the MINOR version is the breaking one: sha2 0.10 -> 0.11 changes
    # the API. Dependabot would open those as routine bumps, which is noise on a
    # repository with one maintainer. So: patches and majors are proposed, minors
    # of a 0.x crate are not.
    ignore:
      - dependency-name: "sha2"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "ecdsa"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "base64"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "p256"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "ed25519-dalek"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "serde_json"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "serde"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
