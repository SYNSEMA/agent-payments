version: 2

# The reference verifiers deliberately have no third-party dependencies - that is the portability
# proof. Dependabot is here for the day that changes, and for the Rust verifier's crates.
updates:
  - package-ecosystem: cargo
    directory: /reference/rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /reference/ts
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
