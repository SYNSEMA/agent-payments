version = 1
SPDX-PackageName = "agent-payments"
SPDX-PackageSupplier = "Csibeings LLC <kitecosmic@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/SYNSEMA/agent-payments"

# Everything in this repository is Apache-2.0, except the licence texts
