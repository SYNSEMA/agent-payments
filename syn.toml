# agent-payments as a recipe: the entry is the console (web.syn), a web app that takes a request
# from a user, has an agent propose a concrete purchase, has a human approve it with a passkey,
# and then produces a signed proof bundle that ANY third party can verify offline with public
# keys only - without this server, without Synsema, and without trusting anybody.
#
# This file only says what the code cannot say about itself; the `require` blocks in web.syn are
# the manifests of capabilities.
#
# Unlike the other recipes in the index, this one needs NO enclave and NO host keys: the evidence
# is portable by construction. That is the point - a payment policy engine whose proof survives
# the platform that produced it.

name = "Agent payments"
slug = "agent-payments"
version = "0.1.0"
kind = "web"
entry = "web.syn"
engine = "0.6"

tagline = "An agent proposes, a human approves with a passkey, and the receipt proving the purchase met the request is verified offline by anyone: public keys only, no enclave, no host keys."
tagline_es = "Un agente propone, una persona aprueba con una passkey, y el recibo que prueba que la compra cumplió lo pedido se verifica offline y cualquiera: solo claves públicas, sin enclave, sin claves del host."
tagline_pt = "Um agente propõe, uma pessoa aprova com uma passkey, e o recibo que prova que a compra atendeu o pedido é verificado offline por qualquer um: apenas chaves públicas, sem enclave, sem chaves do host."

# The console's port. The platform sets it; locally it defaults to 8477.
[env]
PORT = "8477"

# The console's own state: the registered passkey and the proof bundles it issued.
[volumes]
data = "./data"

[source]
repo = "https://github.com/SYNSEMA/agent-payments"
ref = "v0.1.0"
